    const score = localStorage.getItem('quizScore') || 0;
    const totalQuestions = localStorage.getItem('totalQuestions') || 0;
    return { score, totalQuestions };
}

// Calculate percentage
function calculatePercentage(score, total) {
    return ((score / total) * 100).toFixed(1);
}

// Get remarks based on percentage
function getRemarks(percentage) {
    if (percentage >= 80) return 'Excellent';
    if (percentage >= 60) return 'Good';
    if (percentage >= 40) return 'Average';
    return 'Poor';
}

// Update dashboard statistics

    const { score, totalQuestions } = getQuizResults();

    document.getElementById('percentage').textContent = `${percentage}%`;
    document.getElementById('remarks').textContent = remarks;
}
