<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Tutorials</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .tutorial {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .tutorial-header {
            background: #4a69bd;
            color: white;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tutorial-title {
            margin: 0;
            font-size: 1.2em;
        }
        .tutorial-content {
            padding: 0 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .tutorial.active .tutorial-content {
            max-height: 1000px;
            transition: max-height 0.5s ease-in;
        }
        .tutorial-description {
            margin-top: 10px;
            color: #666;
        }
        .start-button {
            display: inline-block;
            background: #4a69bd;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        .start-button:hover {
            background: #3c5aa6;
        }
        .chevron {
            transition: transform 0.3s ease;
        }
        .tutorial.active .chevron {
            transform: rotate(180deg);
        }
        .video-container {
            margin-top: 15px;
            text-align: center;
        }
        .video-container iframe {
            width: 100%;
            height: 315px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Language Tutorials</h1>
        <div id="tutorials-list"></div>
    </div>

    <script>
        const tutorials = [
            {
                id: 1,
                title: "Introduction to Sign Language",
                description: "Learn the basics of sign language and its importance in communication.",
                content: "Sign language is a visual means of communicating using gestures, facial expressions, and body language. This tutorial will introduce you to the world of sign language, its history, and its significance in the deaf community.",
                videoUrl: "https://youtu.be/Y4stD_ypaAI"
            },
            {
                id: 2,
                title: "Fingerspelling and Numbers",
                description: "Master the hand shapes for the alphabet and numbers in sign language.",
                content: "Fingerspelling is an important part of sign language, used for spelling out names and words that don't have a specific sign. This tutorial will teach you how to form each letter of the alphabet and numbers 0-9 using your hands.",
                videoUrl: "https://www.youtube.com/embed/VIDEO_ID_2"
            },
            {
                id: 3,
                title: "Basic Greetings and Phrases",
                description: "Learn common greetings and everyday phrases in sign language.",
                content: "Communication starts with greetings. In this tutorial, you'll learn how to say 'Hello', 'How are you?', 'Thank you', and other common phrases in sign language. We'll also cover basic conversation starters to help you engage with the deaf community.",
                videoUrl: "https://www.youtube.com/embed/VIDEO_ID_3"
            },
            {
                id: 4,
                title: "Emotions and Facial Expressions",
                description: "Understand the role of facial expressions in conveying emotions in sign language.",
                content: "Facial expressions are crucial in sign language to convey tone, emotion, and emphasis. This tutorial will guide you through various facial expressions used in sign language and how they modify the meaning of signs.",
                videoUrl: "https://www.youtube.com/embed/VIDEO_ID_4"
            }
        ];

        function createTutorialElement(tutorial) {
            const tutorialElement = document.createElement('div');
            tutorialElement.className = 'tutorial';
            tutorialElement.innerHTML = `
                <div class="tutorial-header">
                    <h2 class="tutorial-title">${tutorial.title}</h2>
                    <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="tutorial-content">
                    <p class="tutorial-description">${tutorial.description}</p>
                    <p>${tutorial.content}</p>
                    <div class="video-container">
                        <iframe src="${tutorial.videoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <a href="#" class="start-button">Start Tutorial</a>
                </div>
            `;

            tutorialElement.querySelector('.tutorial-header').addEventListener('click', () => {
                tutorialElement.classList.toggle('active');
            });

            return tutorialElement;
        }

        function renderTutorials() {
            const tutorialsList = document.getElementById('tutorials-list');
            tutorials.forEach(tutorial => {
                const tutorialElement = createTutorialElement(tutorial);
                tutorialsList.appendChild(tutorialElement);
            });
        }

        renderTutorials();
    </script>
</body>
</html>
