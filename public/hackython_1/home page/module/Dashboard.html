<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Learning Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dashboard-item {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .progress-bar {
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 20px;
            margin-top: 10px;
        }
        .progress-bar-fill {
            background-color: #3498db;
            border-radius: 8px;
            height: 100%;
            width: 0;
            transition: width 0.5s ease-in-out;
        }
        .module-list, .quiz-list {
            list-style-type: none;
            padding: 0;
        }
        .module-list li, .quiz-list li {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .performance-chart {
            width: 100%;
            height: 200px;
        }
        .time-spent {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        .module-quiz-connection {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enhanced Learning Dashboard</h1>
        <div class="dashboard-grid">
            <div class="dashboard-item">
                <h2>Overall Progress</h2>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="overall-progress"></div>
                </div>
                <p>Completed: <span id="completed-count">0</span> / <span id="total-count">0</span></p>
            </div>
            <div class="dashboard-item">
                <h2>Modules</h2>
                <ul class="module-list" id="module-list"></ul>
            </div>
            <div class="dashboard-item">
                <h2>Quizzes</h2>
                <ul class="quiz-list" id="quiz-list"></ul>
            </div>
            <div class="dashboard-item">
                <h2>Performance</h2>
                <canvas class="performance-chart" id="performance-chart"></canvas>
            </div>
        </div>
        <div class="time-spent" id="time-spent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Sample data (in a real application, this would come from a backend)
        const modules = [
            { id: 1, name: "Introduction to Sign Language", completed: false, quizId: 1 },
            { id: 2, name: "Fingerspelling and Numbers", completed: false, quizId: 2 },
            { id: 3, name: "Basic Greetings and Phrases", completed: false, quizId: 3 },
            { id: 4, name: "Emotions and Facial Expressions", completed: false, quizId: 4 }
        ];

        const quizzes = [
            { id: 1, name: "Quiz 1: Basics", completed: false, score: null, moduleId: 1 },
            { id: 2, name: "Quiz 2: Fingerspelling", completed: false, score: null, moduleId: 2 },
            { id: 3, name: "Quiz 3: Greetings", completed: false, score: null, moduleId: 3 },
            { id: 4, name: "Quiz 4: Emotions", completed: false, score: null, moduleId: 4 }
        ];

        let timeSpent = 0; // Time spent in seconds

        // Function to update the overall progress
        function updateOverallProgress() {
            const totalItems = modules.length + quizzes.length;
            const completedItems = modules.filter(m => m.completed).length + quizzes.filter(q => q.completed).length;
            const progressPercentage = (completedItems / totalItems) * 100;

            document.getElementById('overall-progress').style.width = `${progressPercentage}%`;
            document.getElementById('completed-count').textContent = completedItems;
            document.getElementById('total-count').textContent = totalItems;
        }

        // Function to render modules
        function renderModules() {
            const moduleList = document.getElementById('module-list');
            moduleList.innerHTML = modules.map(module => `
                <li>
                    ${module.name}
                    ${module.completed ? 
                        '<span style="color: green;">✓ Completed</span>' : 
                        `<button class="btn" onclick="completeModule(${module.id})">Start</button>`
                    }
                    <div class="module-quiz-connection">
                        Associated Quiz: ${quizzes.find(q => q.id === module.quizId).name}
                    </div>
                </li>
            `).join('');
        }

        // Function to render quizzes
        function renderQuizzes() {
            const quizList = document.getElementById('quiz-list');
            quizList.innerHTML = quizzes.map(quiz => `
                <li>
                    ${quiz.name}
                    ${quiz.completed ? 
                        `<span style="color: green;">✓ Completed (Score: ${quiz.score}%)</span>` : 
                        `<button class="btn" onclick="takeQuiz(${quiz.id})">Take Quiz</button>`
                    }
                    <div class="module-quiz-connection">
                        Associated Module: ${modules.find(m => m.id === quiz.moduleId).name}
                    </div>
                </li>
            `).join('');
        }

        // Function to complete a module
        function completeModule(id) {
            const module = modules.find(m => m.id === id);
            if (module) {
                module.completed = true;
                renderModules();
                updateOverallProgress();
                updatePerformanceChart();
            }
        }

        // Function to take a quiz
        function takeQuiz(id) {
            const quiz = quizzes.find(q => q.id === id);
            if (quiz) {
                // Simulate taking a quiz (in a real app, this would open the quiz interface)
                quiz.completed = true;
                quiz.score = Math.floor(Math.random() * 41) + 60; // Random score between 60 and 100
                renderQuizzes();
                updateOverallProgress();
                updatePerformanceChart();
            }
        }

        // Function to update the performance chart
        function updatePerformanceChart() {
            const ctx = document.getElementById('performance-chart').getContext('2d');
            const completedQuizzes = quizzes.filter(q => q.completed);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: completedQuizzes.map(q => q.name),
                    datasets: [{
                        label: 'Quiz Scores',
                        data: completedQuizzes.map(q => q.score),
                        backgroundColor: 'rgba(52, 152, 219, 0.6)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Function to update time spent
        function updateTimeSpent() {
            timeSpent++;
            const hours = Math.floor(timeSpent / 3600);
            const minutes = Math.floor((timeSpent % 3600) / 60);
            const seconds = timeSpent % 60;
            document.getElementById('time-spent').textContent = `Time Spent on Website: ${hours}h ${minutes}m ${seconds}s`;
        }

        // Initialize the dashboard
        updateOverallProgress();
        renderModules();
        renderQuizzes();
        updatePerformanceChart();

        // Start tracking time spent
        setInterval(updateTimeSpent, 1000);
    </script>
</body>
</html>
